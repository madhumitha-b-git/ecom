name: CD Pipeline (Deploy to AWS)

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install boto3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ap-southeast-1

      # Note: We run the deploy script with no args here to build and deploy.
      # If we wanted to download artifacts from a separate workflow, it requires complex workflow_run configuration. 
      # Since this runs completely isolated, rebuilding here guarantees the freshest code is deployed.
      - name: Build and Deploy to AWS
        run: python deploy_to_aws.py
