name: cart-service Pipeline

on:
  push:
    branches:
      - main
      - temp
    paths:
      - 'microservices/cart-service/**'
      - '.github/workflows/cart-service.yml'
      - 'deploy_to_aws.py'
  pull_request:
    paths:
      - 'microservices/cart-service/**'

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@39cd14951b4efaa2628f74851955d96c4340d2b9
        with:
          python-version: '3.12'

      - name: Install Linting & Testing Dependencies
        run: pip install flake8==7.0.0 pytest boto3 fastapi

      - name: Run Flake8 Linter
        run: flake8 microservices/cart-service/ --max-line-length=120 --ignore=E402,W503,F401 --exit-zero

      - name: Run Pytest
        run: pytest microservices/cart-service/ || true

      - name: Install Service Dependencies for Snyk
        run: |
          if [ -f "microservices/cart-service/requirements.txt" ]; then
            pip install -r "microservices/cart-service/requirements.txt"
          fi

      - name: Install Snyk
        run: npm install -g snyk --ignore-scripts

      - name: Snyk Dependency Scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --file=microservices/cart-service/requirements.txt --severity-threshold=high || true
        continue-on-error: true

      - name: SonarCloud Code Quality Scan
        uses: sonarsource/sonarcloud-github-action@cb2521193779e908f50ad794ec3a40b4b896ecb4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: true

      - name: Build Dry-Run
        run: python deploy_to_aws.py --build-only --service cart-service

  cd:
    name: Continuous Deployment
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@39cd14951b4efaa2628f74851955d96c4340d2b9
        with:
          python-version: '3.12'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d44e03b00a1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ap-southeast-1

      - name: Deploy to AWS Lambda
        run: python deploy_to_aws.py --deploy-only --service cart-service
