name: analytics-service Pipeline

on:
  push:
    branches:
      - main
      - temp
    paths:
      - 'microservices/analytics-service/**'
      - '.github/workflows/analytics-service.yml'
      - 'deploy_to_aws.py'
  pull_request:
    paths:
      - 'microservices/analytics-service/**'

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linting & Testing Dependencies
        run: pip install flake8 pytest boto3 fastapi

      - name: Run Flake8 Linter
        run: flake8 microservices/analytics-service/ --max-line-length=120 --ignore=E402,W503,F401 --exit-zero

      - name: Run Pytest
        run: pytest microservices/analytics-service/ || true

      - name: Install Service Dependencies for Snyk
        run: |
          if [ -f "microservices/analytics-service/requirements.txt" ]; then
            pip install -r "microservices/analytics-service/requirements.txt"
          fi

      - name: Install Snyk
        run: npm install -g snyk

      - name: Snyk Dependency Scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --file=microservices/analytics-service/requirements.txt --severity-threshold=high || true
        continue-on-error: true

      - name: SonarCloud Code Quality Scan
        uses: sonarsource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: true

      - name: Build Dry-Run
        run: python deploy_to_aws.py --build-only --service analytics-service

  cd:
    name: Continuous Deployment
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ap-southeast-1

      - name: Deploy to AWS Lambda
        run: python deploy_to_aws.py --deploy-only --service analytics-service
