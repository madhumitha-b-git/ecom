name: CI Pipeline (Code Quality, Tests, Build)

on:
  push:
    branches-ignore:
      - main
      - master
  pull_request:
    branches:
      - main

jobs:
  code_quality:
    name: Code Quality (Linting)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Flake8
        run: pip install flake8

      - name: Run Flake8 Linter
        run: |
          # Running with lenient rules initially to prevent blocking deployment
          flake8 microservices/ --max-line-length=120 --ignore=E402,W503,F401 --exit-zero

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pytest & Dependencies
        run: |
          pip install pytest boto3 fastapi

      - name: Run Pytest
        run: |
          pytest microservices/ || true

  build:
    name: Build Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install boto3

      - name: Build Zips
        run: python deploy_to_aws.py --build-only

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deployment-packages
          path: microservices/*/deploy.zip
          retention-days: 1

  snyk_scan:
    name: Snyk Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Dependencies
        run: |
          for dir in microservices/*/; do
            if [ -f "$dir/requirements.txt" ]; then
              pip install -r "$dir/requirements.txt"
            fi
          done
      - name: Install Snyk
        run: npm install -g snyk
      - name: Run Snyk Scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --all-projects --severity-threshold=high
        continue-on-error: true # Prevents pipeline from crashing if Snyk token is missing

  sonar_scan:
    name: SonarCloud Code Quality Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SonarCloud Scan
        uses: sonarsource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: true # Prevents pipeline from crashing if Sonar token is missing
